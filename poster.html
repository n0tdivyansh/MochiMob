<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mochi Mob Poster Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1224;
      font-family: 'Baloo 2', cursive, sans-serif;
    }
    #poster-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="poster-canvas"></canvas>

  <script>
    const canvas = document.getElementById('poster-canvas');
    const ctx = canvas.getContext('2d');

    // Palettes matching Mochi Mob constants
    const COLORS = ['#ff7aa2', '#68c954', '#ffd24d', '#997bf7'];
    const SHADES = ['#c93667', '#3f8c32', '#c98a12', '#6b4bc7'];
    const LIGHTS = ['#ffe1eb', '#dcfadb', '#fff5cc', '#ece6ff'];
    const CHEEKS = ['rgba(255, 60, 110, 0.45)', 'rgba(230, 80, 80, 0.35)', 'rgba(255, 100, 50, 0.38)', 'rgba(220, 80, 150, 0.4)'];

    function glyphPath(ctx, kind, x, y, s) {
      ctx.beginPath();
      if (kind === 'heart') {
        ctx.moveTo(x, y + s * 0.35);
        ctx.bezierCurveTo(x - s, y - s * 0.3, x - s * 0.35, y - s, x, y - s * 0.4);
        ctx.bezierCurveTo(x + s * 0.35, y - s, x + s, y - s * 0.3, x, y + s * 0.35);
      } else if (kind === 'leaf') {
        ctx.moveTo(x - s * 0.6, y + s * 0.5);
        ctx.quadraticCurveTo(x - s * 0.7, y - s * 0.7, x + s * 0.6, y - s * 0.6);
        ctx.quadraticCurveTo(x + s * 0.5, y + s * 0.6, x - s * 0.6, y + s * 0.5);
      } else if (kind === 'star') {
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + (k * Math.PI) / 5;
          const r = k % 2 ? s * 0.42 : s * 0.9;
          ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        }
      } else { // moon
        ctx.arc(x, y, s * 0.7, Math.PI * 0.35, Math.PI * 1.65);
        ctx.arc(x + s * 0.35, y - s * 0.1, s * 0.55, Math.PI * 1.45, Math.PI * 0.55, true);
      }
      ctx.closePath();
    }

    function drawSquishyMochi(ctx, { x, y, r = 100, color = 0, glyph = 'heart', squashX = 1, squashY = 1, angle = 0, blink = false, openMouth = true, wink = false, looking = { x: 0, y: 0 } }) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(squashX, squashY);

      // Soft shadow underneath
      ctx.save();
      ctx.fillStyle = 'rgba(20, 10, 30, 0.28)';
      ctx.beginPath();
      ctx.ellipse(0, r * 0.95, r * 0.9, r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Soft body outline with cute bottom flattening
      ctx.beginPath();
      const n = 36;
      for (let k = 0; k <= n; k++) {
        const a = (k / n) * Math.PI * 2;
        const c = Math.cos(a);
        const s = Math.sin(a);
        const flat = s > 0 ? 0.93 + 0.07 * (1 - s) : 1;
        const px = Math.sign(c) * Math.pow(Math.abs(c), 0.82) * r * 1.1;
        const py = Math.sign(s) * Math.pow(Math.abs(s), 0.9) * r * flat;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();

      // Rich 3D gradient fill
      const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.08, 0, 0, r * 1.35);
      grad.addColorStop(0, LIGHTS[color]);
      grad.addColorStop(0.42, COLORS[color]);
      grad.addColorStop(1, SHADES[color]);
      ctx.fillStyle = grad;
      ctx.fill();

      // Soft outline stroke
      ctx.lineWidth = Math.max(4, r * 0.05);
      ctx.strokeStyle = 'rgba(43, 29, 51, 0.22)';
      ctx.stroke();

      // Glossy specular highlight arc
      ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.38, -r * 0.48, r * 0.34, r * 0.16, -0.45, 0, Math.PI * 2);
      ctx.fill();

      // Small secondary gloss bead
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.arc(-r * 0.12, -r * 0.65, r * 0.06, 0, Math.PI * 2);
      ctx.fill();

      // Glyph tattoo on right cheek
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      glyphPath(ctx, glyph, r * 0.58, -r * 0.02, r * 0.18);
      ctx.fill();

      // Kawaii Eyes
      const eyeDX = r * 0.36;
      const eyeY = -r * 0.06 + looking.y * (r * 0.05);
      const eyeR = r * 0.13;

      for (let side of [-1, 1]) {
        const eyeX = side * eyeDX + looking.x * (r * 0.06);

        // Blushing cheek
        ctx.fillStyle = CHEEKS[color];
        ctx.beginPath();
        ctx.ellipse(side * r * 0.58, eyeY + r * 0.18, r * 0.18, r * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();

        if (wink && side === 1) {
          // Winking eye
          ctx.strokeStyle = '#2b1d33';
          ctx.lineWidth = r * 0.07;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(eyeX, eyeY + r * 0.02, eyeR, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        } else if (blink) {
          // Blinking eye
          ctx.strokeStyle = '#2b1d33';
          ctx.lineWidth = r * 0.06;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(eyeX - eyeR, eyeY);
          ctx.lineTo(eyeX + eyeR, eyeY);
          ctx.stroke();
        } else {
          // Big expressive glossy eye
          ctx.fillStyle = '#2b1d33';
          ctx.beginPath();
          ctx.ellipse(eyeX, eyeY, eyeR, eyeR * 1.25, 0, 0, Math.PI * 2);
          ctx.fill();

          // Big catchlight reflection
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(eyeX - eyeR * 0.35, eyeY - eyeR * 0.45, eyeR * 0.48, 0, Math.PI * 2);
          ctx.fill();

          // Small secondary catchlight
          ctx.beginPath();
          ctx.arc(eyeX + eyeR * 0.4, eyeY + eyeR * 0.4, eyeR * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Mouth
      ctx.fillStyle = '#2b1d33';
      ctx.strokeStyle = '#2b1d33';
      ctx.lineWidth = Math.max(3, r * 0.055);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const mouthY = eyeY + r * 0.24;
      if (openMouth) {
        // Joyful open smiling mouth with cute tongue
        ctx.beginPath();
        ctx.arc(0, mouthY, r * 0.15, 0.1, Math.PI - 0.1);
        ctx.closePath();
        ctx.fill();

        // Tongue
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, mouthY, r * 0.15, 0.1, Math.PI - 0.1);
        ctx.clip();
        ctx.fillStyle = '#ff7aa2';
        ctx.beginPath();
        ctx.arc(0, mouthY + r * 0.14, r * 0.11, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        // Gentle happy cat smile ^-^
        ctx.beginPath();
        ctx.arc(-r * 0.08, mouthY, r * 0.09, 0.1, Math.PI * 0.85);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r * 0.08, mouthY, r * 0.09, 0.15, Math.PI * 0.9);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Draw stylized 3D Golden Door
    function drawGoldenDoor(ctx, x, y, w, h) {
      ctx.save();
      ctx.translate(x, y);

      // Outer glow
      const glow = ctx.createRadialGradient(0, -h * 0.4, 20, 0, -h * 0.4, w * 1.4);
      glow.addColorStop(0, 'rgba(255, 230, 120, 0.55)');
      glow.addColorStop(0.7, 'rgba(255, 200, 60, 0.15)');
      glow.addColorStop(1, 'rgba(255, 200, 60, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, -h * 0.4, w * 1.3, 0, Math.PI * 2);
      ctx.fill();

      // Arch stone frame
      ctx.fillStyle = '#f0c05a';
      ctx.beginPath();
      ctx.arc(0, -h + w / 2, w / 2 + 18, Math.PI, 0);
      ctx.lineTo(w / 2 + 18, 0);
      ctx.lineTo(-w / 2 - 18, 0);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#b8811e';
      ctx.stroke();

      // Inner glowing portal
      const portalGrad = ctx.createLinearGradient(0, -h, 0, 0);
      portalGrad.addColorStop(0, '#fff4b8');
      portalGrad.addColorStop(0.5, '#ffd24d');
      portalGrad.addColorStop(1, '#ff9900');
      ctx.fillStyle = portalGrad;
      ctx.beginPath();
      ctx.arc(0, -h + w / 2, w / 2, Math.PI, 0);
      ctx.lineTo(w / 2, 0);
      ctx.lineTo(-w / 2, 0);
      ctx.closePath();
      ctx.fill();

      // Inner star symbol
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      glyphPath(ctx, 'star', 0, -h * 0.6, 24);
      ctx.fill();

      ctx.restore();
    }

    // Draw Golden Sparkling Key
    function drawGoldenKey(ctx, x, y, size = 60, rot = 0.3) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      // Sparkle glow
      const keyGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, size * 1.8);
      keyGlow.addColorStop(0, 'rgba(255, 240, 150, 0.9)');
      keyGlow.addColorStop(0.5, 'rgba(255, 210, 50, 0.4)');
      keyGlow.addColorStop(1, 'rgba(255, 200, 0, 0)');
      ctx.fillStyle = keyGlow;
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.8, 0, Math.PI * 2);
      ctx.fill();

      // 3D Shadow
      ctx.fillStyle = '#b37400';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-size * 0.5, 3, size * 0.4, 0, Math.PI * 2);
      ctx.moveTo(-size * 0.2, 3);
      ctx.lineTo(size * 0.7, 3);
      ctx.moveTo(size * 0.4, 3);
      ctx.lineTo(size * 0.4, size * 0.3 + 3);
      ctx.moveTo(size * 0.65, 3);
      ctx.lineTo(size * 0.65, size * 0.24 + 3);
      ctx.stroke();

      // Gold key
      const keyGrad = ctx.createLinearGradient(-size, -size, size, size);
      keyGrad.addColorStop(0, '#fffbe6');
      keyGrad.addColorStop(0.4, '#ffd700');
      keyGrad.addColorStop(1, '#ff9900');
      ctx.strokeStyle = keyGrad;
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.arc(-size * 0.5, 0, size * 0.4, 0, Math.PI * 2);
      ctx.moveTo(-size * 0.2, 0);
      ctx.lineTo(size * 0.7, 0);
      ctx.moveTo(size * 0.4, 0);
      ctx.lineTo(size * 0.4, size * 0.3);
      ctx.moveTo(size * 0.65, 0);
      ctx.lineTo(size * 0.65, size * 0.24);
      ctx.stroke();

      // Keyhole inside loop
      ctx.fillStyle = '#6b4500';
      ctx.beginPath();
      ctx.arc(-size * 0.5, 0, size * 0.18, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Draw lush background scenery
    function drawMeadowBackground(ctx, w, h) {
      // Sky gradient - vibrant, warm daylight into clear azure
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, '#53a8ff');
      skyGrad.addColorStop(0.35, '#87c7ff');
      skyGrad.addColorStop(0.7, '#fef0d2');
      skyGrad.addColorStop(1, '#ffc7a8');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // Fluffy atmospheric cumulus clouds (lush in top-left to naturally create buffer for labels!)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      function drawCloud(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(-80, 20, 55, 0, Math.PI * 2);
        ctx.arc(-30, -10, 75, 0, Math.PI * 2);
        ctx.arc(45, -25, 95, 0, Math.PI * 2);
        ctx.arc(120, -5, 70, 0, Math.PI * 2);
        ctx.arc(170, 25, 55, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Upper left soft clouds (natural buffer for portal badge)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      drawCloud(w * 0.12, h * 0.15, 0.95);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      drawCloud(w * 0.22, h * 0.24, 1.1);

      // Upper right clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      drawCloud(w * 0.85, h * 0.18, 1.0);

      // Distant mountains / rolling hills
      ctx.fillStyle = '#6ec08f';
      ctx.beginPath();
      ctx.moveTo(-100, h * 0.75);
      ctx.bezierCurveTo(w * 0.2, h * 0.55, w * 0.5, h * 0.7, w * 0.8, h * 0.6);
      ctx.bezierCurveTo(w * 0.95, h * 0.56, w * 1.05, h * 0.65, w + 100, h * 0.68);
      ctx.lineTo(w + 100, h);
      ctx.lineTo(-100, h);
      ctx.closePath();
      ctx.fill();

      // Middle hill
      ctx.fillStyle = '#55ad74';
      ctx.beginPath();
      ctx.moveTo(-100, h * 0.82);
      ctx.bezierCurveTo(w * 0.3, h * 0.72, w * 0.7, h * 0.88, w + 100, h * 0.76);
      ctx.lineTo(w + 100, h);
      ctx.lineTo(-100, h);
      ctx.closePath();
      ctx.fill();

      // Foreground lush meadow with flowers
      const foreGrad = ctx.createLinearGradient(0, h * 0.75, 0, h);
      foreGrad.addColorStop(0, '#429e61');
      foreGrad.addColorStop(1, '#2c7343');
      ctx.fillStyle = foreGrad;
      ctx.beginPath();
      ctx.moveTo(-100, h * 0.85);
      ctx.bezierCurveTo(w * 0.35, h * 0.86, w * 0.65, h * 0.8, w + 100, h * 0.88);
      ctx.lineTo(w + 100, h);
      ctx.lineTo(-100, h);
      ctx.closePath();
      ctx.fill();

      // Cute grassy blades and colorful flowers
      const flowerColors = ['#ff7aa2', '#ffd24d', '#ffffff', '#997bf7'];
      for (let i = 0; i < 45; i++) {
        const fx = ((i * 137.5) % w);
        const fy = h * 0.86 + ((i * 47) % (h * 0.12));
        ctx.fillStyle = flowerColors[i % flowerColors.length];
        ctx.beginPath();
        ctx.arc(fx, fy, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd24d';
        ctx.beginPath();
        ctx.arc(fx, fy, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw confetti & sparkles
    function drawCelebrationSparkles(ctx, w, h) {
      const colors = ['#ffd24d', '#ff7aa2', '#68c954', '#997bf7', '#ffffff'];
      for (let i = 0; i < 60; i++) {
        const x = (i * 97 + 53) % w;
        const y = (i * 179 + 31) % (h * 0.75);
        const s = 6 + (i % 8);
        const rot = (i * 0.6);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.fillStyle = colors[i % colors.length];

        if (i % 3 === 0) {
          // 4-point star sparkle
          glyphPath(ctx, 'star', 0, 0, s * 1.5);
          ctx.fill();
        } else if (i % 3 === 1) {
          // Confetti ribbon
          ctx.fillRect(-s, -s * 0.4, s * 2, s * 0.8);
        } else {
          // Floating heart or gold coin
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Draw Extruded 3D Title Typography
    function draw3DTitle(ctx, text, subtext, x, y, size = 110, align = 'center') {
      ctx.save();
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      // 3D Extrusion Layers (Bottom Shadow / Rim)
      ctx.font = `900 ${size}px 'Baloo 2', cursive, sans-serif`;
      const depth = Math.round(size * 0.12);

      // Deep shadow
      ctx.fillStyle = 'rgba(27, 18, 36, 0.45)';
      ctx.fillText(text, x + depth * 0.6, y + depth + 14);

      // Extruded 3D spine
      ctx.fillStyle = '#b83262';
      for (let d = depth; d >= 1; d--) {
        ctx.fillText(text, x, y + d);
      }

      // Front Face Outline
      ctx.lineWidth = Math.max(6, size * 0.08);
      ctx.strokeStyle = '#6e1236';
      ctx.strokeText(text, x, y);

      // Front Face Vibrant Gradient
      const titleGrad = ctx.createLinearGradient(x, y - size * 0.5, x, y + size * 0.5);
      titleGrad.addColorStop(0, '#ffffff');
      titleGrad.addColorStop(0.25, '#ffe58f');
      titleGrad.addColorStop(0.7, '#ff5487');
      titleGrad.addColorStop(1, '#e02868');
      ctx.fillStyle = titleGrad;
      ctx.fillText(text, x, y);

      // Inner white highlight stroke
      ctx.lineWidth = Math.max(2, size * 0.025);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.strokeText(text, x, y);

      // Subtitle Pill Banner
      if (subtext) {
        const subSize = Math.round(size * 0.28);
        ctx.font = `800 ${subSize}px 'Baloo 2', cursive, sans-serif`;
        const subY = y + size * 0.65;
        const metrics = ctx.measureText(subtext);
        const pillW = metrics.width + 36;
        const pillH = subSize * 1.7;

        // Pill shadow
        ctx.fillStyle = 'rgba(27, 18, 36, 0.35)';
        ctx.beginPath();
        ctx.roundRect(x - (align === 'center' ? pillW / 2 : 0) + 3, subY - pillH / 2 + 4, pillW, pillH, pillH / 2);
        ctx.fill();

        // Pill background
        const pillGrad = ctx.createLinearGradient(0, subY - pillH / 2, 0, subY + pillH / 2);
        pillGrad.addColorStop(0, '#ffd84d');
        pillGrad.addColorStop(1, '#ff9900');
        ctx.fillStyle = pillGrad;
        ctx.beginPath();
        ctx.roundRect(x - (align === 'center' ? pillW / 2 : 0), subY - pillH / 2, pillW, pillH, pillH / 2);
        ctx.fill();

        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#2b1d33';
        ctx.fillText(subtext, x, subY);
      }

      ctx.restore();
    }

    // MAIN RENDER FUNCTION FOR DIFFERENT FORMATS
    window.renderPoster = function(format) {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      drawMeadowBackground(ctx, w, h);
      drawCelebrationSparkles(ctx, w, h);

      if (format === 'landscape') {
        // 16:9 Landscape Layout (1920 x 1080)
        // Golden Door in right background
        drawGoldenDoor(ctx, w * 0.86, h * 0.82, 130, 220);

        // Golden Key floating mid-air near the top
        drawGoldenKey(ctx, w * 0.52, h * 0.32, 65, 0.25);

        // Cute Team of 4 Mochis interacting in center-foreground:
        // 1. Pink (Strawberry) squished at the bottom acting as a bouncy trampoline base!
        drawSquishyMochi(ctx, {
          x: w * 0.38,
          y: h * 0.83,
          r: 120,
          color: 0,
          glyph: 'heart',
          squashX: 1.45,
          squashY: 0.65,
          openMouth: false,
          looking: { x: 0, y: -1 }
        });

        // 2. Yellow (Yuzu) jumping off Pink, winking with joy!
        drawSquishyMochi(ctx, {
          x: w * 0.38,
          y: h * 0.57,
          r: 105,
          color: 2,
          glyph: 'star',
          squashX: 0.9,
          squashY: 1.15,
          angle: -0.06,
          wink: true,
          openMouth: true,
          looking: { x: 0.5, y: -0.5 }
        });

        // 3. Green (Matcha) cheering on the left!
        drawSquishyMochi(ctx, {
          x: w * 0.20,
          y: h * 0.82,
          r: 100,
          color: 1,
          glyph: 'leaf',
          squashX: 1.05,
          squashY: 0.95,
          angle: 0.12,
          openMouth: true,
          looking: { x: 1, y: -0.5 }
        });

        // 4. Purple (Ube) reaching toward the key on the right!
        drawSquishyMochi(ctx, {
          x: w * 0.65,
          y: h * 0.78,
          r: 105,
          color: 3,
          glyph: 'moon',
          squashX: 0.95,
          squashY: 1.1,
          angle: -0.15,
          openMouth: true,
          looking: { x: -0.5, y: -1 }
        });

        // Prominent 3D Title on the Upper Right (clear of dragon/clouds, leaves upper-left natural for platform badges!)
        draw3DTitle(ctx, 'MOCHI MOB', 'SQUISHY CO-OP QUEST', w * 0.70, h * 0.19, 140, 'center');

      } else if (format === 'portrait') {
        // 2:3 Portrait Layout (1200 x 1800)
        // Title at the Top Center
        draw3DTitle(ctx, 'MOCHI MOB', 'SQUISHY CO-OP QUEST', w * 0.5, h * 0.15, 145, 'center');

        // Floating Golden Key below title
        drawGoldenKey(ctx, w * 0.5, h * 0.34, 75, 0.2);

        // Golden Door in center background
        drawGoldenDoor(ctx, w * 0.5, h * 0.91, 170, 270);

        // Towering 4-Mochi Stack (The iconic Mochi Mob pyramid)!
        // Base Mochi: Purple (Ube) squished wide on the ground
        drawSquishyMochi(ctx, {
          x: w * 0.5,
          y: h * 0.86,
          r: 145,
          color: 3,
          glyph: 'moon',
          squashX: 1.35,
          squashY: 0.75,
          openMouth: false,
          looking: { x: 0, y: -1 }
        });

        // Second Mochi: Green (Matcha) balanced on top
        drawSquishyMochi(ctx, {
          x: w * 0.5,
          y: h * 0.70,
          r: 135,
          color: 1,
          glyph: 'leaf',
          squashX: 1.1,
          squashY: 0.92,
          openMouth: true,
          looking: { x: 0.5, y: -0.5 }
        });

        // Third Mochi: Pink (Strawberry) squishing happily
        drawSquishyMochi(ctx, {
          x: w * 0.5,
          y: h * 0.54,
          r: 125,
          color: 0,
          glyph: 'heart',
          squashX: 1.05,
          squashY: 0.95,
          wink: true,
          openMouth: true,
          looking: { x: -0.5, y: -1 }
        });

        // Top Mochi: Yellow (Yuzu) reaching high for the Golden Key!
        drawSquishyMochi(ctx, {
          x: w * 0.5,
          y: h * 0.40,
          r: 115,
          color: 2,
          glyph: 'star',
          squashX: 0.88,
          squashY: 1.18,
          openMouth: true,
          looking: { x: 0, y: -1 }
        });

      } else {
        // 1:1 Square Layout (1200 x 1200)
        // Title at Top Center
        draw3DTitle(ctx, 'MOCHI MOB', 'CO-OP PUZZLE QUEST', w * 0.5, h * 0.16, 125, 'center');

        // Golden Door in right background
        drawGoldenDoor(ctx, w * 0.82, h * 0.88, 120, 190);

        // Golden Key floating mid-left
        drawGoldenKey(ctx, w * 0.35, h * 0.36, 65, 0.2);

        // Joyful 3-Mochi Stack with 4th bouncing:
        // Base: Purple squished
        drawSquishyMochi(ctx, {
          x: w * 0.48,
          y: h * 0.85,
          r: 135,
          color: 3,
          glyph: 'moon',
          squashX: 1.4,
          squashY: 0.72,
          openMouth: false,
          looking: { x: 0, y: -1 }
        });

        // Mid: Pink cheering
        drawSquishyMochi(ctx, {
          x: w * 0.48,
          y: h * 0.69,
          r: 120,
          color: 0,
          glyph: 'heart',
          squashX: 1.05,
          squashY: 0.95,
          openMouth: true,
          looking: { x: 0.5, y: -0.5 }
        });

        // Top: Yellow reaching for key
        drawSquishyMochi(ctx, {
          x: w * 0.48,
          y: h * 0.53,
          r: 110,
          color: 2,
          glyph: 'star',
          squashX: 0.88,
          squashY: 1.15,
          wink: true,
          openMouth: true,
          looking: { x: -0.5, y: -1 }
        });

        // Green bouncing in from left
        drawSquishyMochi(ctx, {
          x: w * 0.18,
          y: h * 0.82,
          r: 105,
          color: 1,
          glyph: 'leaf',
          squashX: 1.1,
          squashY: 0.9,
          angle: 0.15,
          openMouth: true,
          looking: { x: 1, y: -0.5 }
        });
      }
    };

    // Auto-render on resize
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const aspect = canvas.width / canvas.height;
      let fmt = 'landscape';
      if (aspect < 0.8) fmt = 'portrait';
      else if (aspect >= 0.8 && aspect <= 1.25) fmt = 'square';
      window.renderPoster(fmt);
    }

    document.fonts.ready.then(() => {
      resize();
      window.addEventListener('resize', resize);
    });
  </script>
</body>
</html>
